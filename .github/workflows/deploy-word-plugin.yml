name: Build Word Plugin (CI only)

# The word-plugin is NOT deployed to GitHub Pages — only the web-dashboard is.
# This workflow builds to validate the plugin compiles correctly on every push.

on:
  push:
    branches: [main]
    paths:
      - 'packages/word-plugin/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-word-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Word Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Build word plugin
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
        run: npm run build --workspace=packages/word-plugin

      - name: Upload dist as artifact (for download, not Pages)
        uses: actions/upload-artifact@v4
        with:
          name: word-plugin-dist
          path: packages/word-plugin/dist
          retention-days: 7
